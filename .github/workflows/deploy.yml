Here's a production-ready GitHub Actions workflow for deploying the `profiles-rest-api` to an EKS cluster:

```yml
# .github/workflows/deploy.yml

name: Deploy to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: profiles-rest-api
  EKS_CLUSTER: my-eks
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/login-to-ecr@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          ecr-registry: ${{ env.AWS_REGION }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:latest .
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ env.AWS_REGION }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.AWS_REGION }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

      - name: Configure kubectl
        uses: aws-actions/configure-eks-kubectl@v1
        with:
          cluster-name: ${{ env.EKS_CLUSTER }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply deployment and service configurations
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
```

This workflow does the following:

1. Triggers on push events to the `main` branch.
2. Checks out the code in the repository.
3. Configures AWS credentials using the provided secrets.
4. Logs in to the Amazon ECR registry.
5. Builds a Docker image with the `latest` tag and pushes it to the ECR registry.
6. Configures `kubectl` to interact with the specified EKS cluster.
7. Applies the `deployment.yaml` and `service.yaml` configurations to the EKS cluster.

Note that you should replace the `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `AWS_REGION` secrets with your actual AWS credentials and region. Additionally, make sure to update the `ECR_REPOSITORY` and `EKS_CLUSTER` environment variables to match your ECR repository and EKS cluster names.
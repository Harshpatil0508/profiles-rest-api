Here's a production-ready GitHub Actions workflow for deploying the `profiles-rest-api` to an EKS cluster:

```yml
# .github/workflows/deploy.yml

name: Deploy to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: profiles-rest-api
  EKS_CLUSTER: profiles-rest-api-eks-cluster
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/login-to-ecr@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          ecr-registry: ${{ env.ECR_REPOSITORY }}

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REPOSITORY:latest .
          docker tag $ECR_REPOSITORY:latest $ECR_REPOSITORY.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Configure kubectl
        uses: aws-actions/configure-eks-cluster@v1
        with:
          cluster-name: ${{ env.EKS_CLUSTER }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply deployment and service configurations
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment profiles-rest-api -n default
```

**Explanation:**

1. The workflow is triggered on push events to the `main` branch.
2. It checks out the code and configures AWS credentials using the `aws-actions/configure-aws-credentials` action.
3. It logs in to the ECR repository using the `aws-actions/login-to-ecr` action.
4. It builds and pushes the Docker image to the ECR repository.
5. It configures `kubectl` to interact with the EKS cluster using the `aws-actions/configure-eks-cluster` action.
6. It applies the deployment and service configurations using `kubectl apply`.
7. It verifies the deployment rollout status using `kubectl rollout status`.

**Note:**

* Make sure to replace the `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `AWS_REGION` secrets with your actual AWS credentials and region.
* Update the `ECR_REPOSITORY` and `EKS_CLUSTER` environment variables to match your ECR repository and EKS cluster names.
* Ensure that the `deployment.yaml` and `service.yaml` files are in the root of your repository and contain the correct configurations for your application.
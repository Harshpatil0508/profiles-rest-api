apiVersion: v1
kind: Service
metadata:
  name: profiles-rest-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  selector:
    app: profiles-rest-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: LoadBalancer
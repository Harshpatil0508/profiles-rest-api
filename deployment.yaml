apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ecr-django
  labels:
    app: demo-ecr-django
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-ecr-django
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-ecr-django
    spec:
      containers:
      - name: django
        image: 026090548194.dkr.ecr.ap-south-1.amazonaws.com/demo-ecr:latest
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "myproject.settings"
        - name: DEBUG
          value: "False"
        - name: DATABASE_URL
          value: "sqlite:///db.sqlite3"
        - name: SECRET_KEY
          value: "change-me-in-production"
        - name: ALLOWED_HOSTS
          value: "*"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - name: sqlite-data
          mountPath: /app/db
      volumes:
      - name: sqlite-data
        emptyDir: {}
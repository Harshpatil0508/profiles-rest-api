apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiles-rest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profiles-rest-api
  template:
    metadata:
      labels:
        app: profiles-rest-api
    spec:
      containers:
      - name: profiles-rest-api
        image: 026090548194.dkr.ecr.ap-south-1.amazonaws.com/profiles-rest-api:latest
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "profiles_rest_api.settings"
        - name: DATABASE_NAME
          value: "profiles.db"
        - name: DATABASE_USER
          value: "root"
        - name: DATABASE_PASSWORD
          value: "root"
        - name: DATABASE_HOST
          value: "localhost"
        - name: DATABASE_PORT
          value: "5432"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthcheck/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthcheck/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
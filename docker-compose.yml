version: '3'
services:
  django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings

  db:
    image: python:3.9-slim
    volumes:
      - db-data:/app/db
    command: tail -f /dev/null

volumes:
  db-data: